<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade Lista de Tarefas</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <img src="img/lista-de-tarefas.jpg" class="img" alt="Imagem Tarefas">

    <h1>Lista de Tarefas</h1>

    <form id="frm">

        <button id="btn3">Retirar Seleção X</button>
    </div>

    <script src="JS/atvd.js"></script>

</body>
</html>
